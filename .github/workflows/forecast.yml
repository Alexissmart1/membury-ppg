# Rebuilds the forecast page every hour and publishes it on GitHub Pages.
# Setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Build forecast page

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may start a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]         # rebuild straight away when you edit build.py

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bring back the last good forecast, so a failed download shows a warning
      # on the page instead of leaving it silently out of date.
      - name: Restore saved forecast
        uses: actions/cache/restore@v4
        with:
          path: data
          key: forecast-${{ github.run_id }}
          restore-keys: forecast-
      - name: Build pages (Python standard library only)
        run: python3 build.py --out-dir site --cache-dir data
      - name: Save forecast for next time
        if: hashFiles('data/last.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: forecast-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
